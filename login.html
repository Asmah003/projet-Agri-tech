<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>connection-Agritech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-app-yellow flex flex-col items-center justify-center min-h-screen p-4">
    <div class="flex items-center justify-start lg:justify-center mb-4">
        <img src="./Agritech App Ressources/favico.png" alt="Logo AGRITECH" class="w-15 h-10 rounded-full mr-2  " />
        <span class="text-3xl text-gray-700">Agritech App</span>
    </div>
    <div class="bg-agritech-green text-white p-8 md:p-12 rounded-xl shadow-2xl max-w-md w-full">
        <h1 class="text-3xl font-bold text-center mb-8">Login</h1>
        <form onsubmit="handleLogin(event)">
            <div class="mb-6">
                <label for="email" class="block text-sm font-medium mb-2">Veuillez saisir votre Email *</label>
                <input type="email" id="email" name="email" placeholder="Email" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-400 transition duration-150">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium mb-2">Veuillez saisir votre Mot de Passe
                    *</label>
                <input type="password" id="password" name="password" placeholder="Password" required
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-400 transition duration-150">
            </div>
            <div class="flex items-center mb-8">
                <input type="checkbox" id="remember" name="remember"
                    class="h-4 w-4 text-green-500 rounded focus:ring-green-400">
                <label for="remember" class="ml-2 text-sm">Se souvenir de moi</label>
            </div>
            <div class="flex justify-end mb-8">
                <button type="submit"
                    class="bg-[#1B915F] hover:bg-yellow-400 text-gray-900 font-bold py-3 px-8 rounded-full transition duration-300 shadow-lg uppercase text-sm flex items-center">
                    Login <i class="fas fa-sign-in-alt ml-2"></i>
                </button>
            </div>
            <p class="text-center text-sm border-t border-white/20 pt-6">
                Veuillez contactez un administrateur si vous avez oublié mot de passe
            </p>
        </form>
    </div>
</body>
</html>
